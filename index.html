    <script>
      (function() {
        try {
          if (!localStorage.getItem('uper-pref-init-v2')) {
            localStorage.setItem('uper-pref-init-v2', 'true');
            localStorage.setItem('i18nextLng', 'id');
            localStorage.setItem('uper-design-style', 'default');
            localStorage.setItem('uper-color-theme', 'teal');
          }
          var style = localStorage.getItem('uper-design-style');
          var theme = localStorage.getItem('uper-color-theme');
          if (style && style !== 'default') {
            document.documentElement.setAttribute('data-design-style', style);
          } else {
            document.documentElement.removeAttribute('data-design-style');
          }
          if (theme && theme !== 'teal') {
            document.documentElement.setAttribute('data-color-theme', theme);
          } else {
            document.documentElement.removeAttribute('data-color-theme');
          }
        } catch (e) {
          // In iframe or third-party cookie blocked mode, localStorage may be restricted
          console.warn('Theme preference init defaulted due to storage isolation:', e);
        }
      })();
    </script>

      <!-- Instant First Contentful Paint (FCP) Critical Pre-render Skeleton -->
      <style>
        .uper-sk-shell {
          min-height: 100vh;

          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

          display: flex;
          align-items: center;
          justify-content: space-between;

          align-items: center;
          gap: 10px;
        }
        .uper-sk-hero {
          max-width: 1280px;
          margin: 40px auto 0;
          padding: 0 24px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 36px;
        }
        @media (min-width: 1024px) {
          .uper-sk-hero {
            grid-template-columns: 1.1fr 0.9fr;
            margin-top: 64px;
            gap: 48px;
          }
        }
        .uper-sk-pulse {
          background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
          background-size: 200% 100%;
          animation: uper-shimmer 1.5s infinite;
          border-radius: 8px;
        }
        @keyframes uper-shimmer {
          0% { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }
      </style>
