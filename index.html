<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Android / Older WebView Compatibility Polyfill Guard -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && typeof window.Iterator === 'undefined') {
          window.Iterator = Object;
        }
      })();
    </script>
    <!-- UPER_METADATA_START -->
    <title>UPER</title>
    <meta data-rh="true" name="robots" content="noindex, nofollow, noarchive" />
    <!-- UPER_METADATA_END -->
    <link rel="icon" type="image/svg+xml" href="/uper-logo-mark.svg" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <script>
      (function() {
        try {
          if (!localStorage.getItem('uper-pref-init-v2')) {
            localStorage.setItem('uper-pref-init-v2', 'true');
            localStorage.setItem('i18nextLng', 'id');
            localStorage.setItem('uper-design-style', 'default');
            localStorage.setItem('uper-color-theme', 'teal');
          }
          var style = localStorage.getItem('uper-design-style');
          var theme = localStorage.getItem('uper-color-theme');
          if (style && style !== 'default') {
            document.documentElement.setAttribute('data-design-style', style);
          } else {
            document.documentElement.removeAttribute('data-design-style');
          }
          if (theme && theme !== 'teal') {
            document.documentElement.setAttribute('data-color-theme', theme);
          } else {
            document.documentElement.removeAttribute('data-color-theme');
          }
        } catch (e) {
          // In iframe or third-party cookie blocked mode, localStorage may be restricted
          console.warn('Theme preference init defaulted due to storage isolation:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant First Contentful Paint (FCP) Critical Pre-render Skeleton -->
      <style>
        .uper-sk-shell {
          min-height: 100vh;
          background: #f8fafc;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #334155;
        }
        .uper-sk-nav {
          height: 72px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
          max-width: 1280px;
          margin: 0 auto;
        }
        .uper-sk-logo {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .uper-sk-hero {
          max-width: 1280px;
          margin: 40px auto 0;
          padding: 0 24px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 36px;
        }
        @media (min-width: 1024px) {
          .uper-sk-hero {
            grid-template-columns: 1.1fr 0.9fr;
            margin-top: 64px;
            gap: 48px;
          }
        }
        .uper-sk-pulse {
          background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
          background-size: 200% 100%;
          animation: uper-shimmer 1.5s infinite;
          border-radius: 8px;
        }
        @keyframes uper-shimmer {
          0% { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }
      </style>
      <div class="uper-sk-shell">
        <header class="uper-sk-nav">
          <div class="uper-sk-logo">
            <div class="uper-sk-pulse" style="width: 36px; height: 36px; border-radius: 8px;"></div>
            <div class="uper-sk-pulse" style="width: 72px; height: 22px; border-radius: 6px;"></div>
          </div>
          <div style="display: flex; gap: 20px; align-items: center;">
            <div class="uper-sk-pulse" style="width: 50px; height: 16px; border-radius: 4px;"></div>
            <div class="uper-sk-pulse" style="width: 65px; height: 16px; border-radius: 4px;"></div>
            <div class="uper-sk-pulse" style="width: 55px; height: 16px; border-radius: 4px;"></div>
            <div class="uper-sk-pulse" style="width: 100px; height: 36px; border-radius: 18px;"></div>
          </div>
        </header>
        <main class="uper-sk-hero">
          <div>
            <div class="uper-sk-pulse" style="width: 130px; height: 26px; border-radius: 20px; margin-bottom: 24px;"></div>
            <div class="uper-sk-pulse" style="width: 90%; height: 44px; border-radius: 8px; margin-bottom: 16px;"></div>
            <div class="uper-sk-pulse" style="width: 70%; height: 44px; border-radius: 8px; margin-bottom: 24px;"></div>
            <div class="uper-sk-pulse" style="width: 95%; height: 18px; border-radius: 6px; margin-bottom: 12px;"></div>
            <div class="uper-sk-pulse" style="width: 80%; height: 18px; border-radius: 6px; margin-bottom: 32px;"></div>
            <div style="display: flex; gap: 16px;">
              <div class="uper-sk-pulse" style="width: 160px; height: 46px; border-radius: 24px;"></div>
              <div class="uper-sk-pulse" style="width: 140px; height: 46px; border-radius: 24px;"></div>
            </div>
          </div>
          <div>
            <div class="uper-sk-pulse" style="width: 100%; aspect-ratio: 4/3; border-radius: 24px;"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
